[project]
name = "ha-ev-charge-control"
version = "0.0.1"
description = "Home Assistant custom integration for EV smart charging"
readme = "README.md"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# custom_components is not an installed package, so put the repo root on
# sys.path. Without this only "python -m pytest" works.
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Markdown table rows and prose read better unbroken.
"scripts/report/build.py" = ["E501"]
