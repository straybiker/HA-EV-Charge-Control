name: Bug report
description: Report a problem with EV Charge Control
labels: [bug]
body:
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.3.0"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: EV Charge Control version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove tokens, addresses and personal data before you paste.
      render: text
